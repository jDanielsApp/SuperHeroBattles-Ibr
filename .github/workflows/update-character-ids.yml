name: Update SuperHero Character IDs

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-character-ids
  cancel-in-progress: false

jobs:
  update:
    name: Update character IDs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download and update character IDs
        run: python scripts/download_ids.py

      - name: Commit and push changes
        run: |
          git add -- data/character_ids.json
          if git diff --cached --quiet; then
            echo "No ID changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update SuperHero character IDs"
          git push
